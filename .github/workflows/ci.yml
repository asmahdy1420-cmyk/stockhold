name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check .
      - run: ruff format --check .

  test-sqlite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: pytest

  test-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: stockhold
          POSTGRES_PASSWORD: stockhold
          POSTGRES_DB: stockhold_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U stockhold"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    env:
      STOCKHOLD_TEST_DATABASE_URL: postgresql+psycopg://stockhold:stockhold@localhost:5432/stockhold_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev,postgres]"
      - run: pytest
